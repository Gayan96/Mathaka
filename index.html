<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mathaka Gift Shop | Custom photo gifts, mugs and more</title>
  <meta name="description" content="Mathaka Gift Shop: custom photo collages, mugs, Polaroid prints and gifts. Order on WhatsApp.">
  <meta name="theme-color" content="#d6000f">
  <link rel="icon" href="images/logo.png" type="image/png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="announce" class="announce" hidden></div>
  <header class="site-header">
    <div class="wrap header-row">
      <a href="#/" class="brand" aria-label="Mathaka Gift Shop home"><img id="brand-logo" src="images/logo.png" alt="Mathaka Gift Shop" width="140" height="64"></a>
      <form id="search-form" class="search" role="search" autocomplete="off">
        <label class="sr-only" for="search-input">Search products by name or item code</label>
        <input id="search-input" type="search" placeholder="Search by name or item code" inputmode="search">
        <button type="submit" aria-label="Search">🔍</button>
      </form>
      <a href="#/cart" class="cart-link" aria-label="Cart">🛒<span id="cart-count" class="badge" hidden>0</span></a>
      <button id="menu-btn" class="menu-btn" aria-label="Menu" aria-expanded="false">☰</button>
    </div>
    <nav id="main-nav" class="main-nav" aria-label="Main"><div class="wrap" id="nav-links"></div></nav>
  </header>

  <main id="app" class="wrap" tabindex="-1" aria-live="polite"><p class="loading">Loading…</p></main>

  <footer class="site-footer">
    <div class="wrap footer-grid">
      <div><strong id="f-name">Mathaka Gift Shop</strong><p id="f-tagline"></p></div>
      <div id="f-contact"></div>
      <div id="f-links"></div>
    </div>
    <div class="wrap copy">© <span id="year"></span> <span id="f-copy-name">Mathaka Gift Shop</span>. Orders are placed through WhatsApp.</div>
  </footer>

  <a id="wa-float" class="wa-float" href="#" target="_blank" rel="noopener" aria-label="Chat with us on WhatsApp">

  </a>

  <script type="module" src="js/app.js"></script>
</body>
</html>
