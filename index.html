<script>
'use strict';
/* =====================================================================
   OFFLINE POS — single-file application
   Modules: Core/DB · Reports · Charts · UI (Toast/Modal/Confirm) ·
            Barcode/Receipt · Views (Dashboard, POS, Products, Sales,
            Reports, Settings, Backup) · App (router, shortcuts, boot)
   All data lives in localStorage. No server, no database.
   ===================================================================== */

/* ======================= 1. CONSTANTS & HELPERS ======================= */
const APP_ID = 'offline-pos';
const APP_VERSION = 1;

/** localStorage keys (one per data set) */
const LS = {
  settings: 'companySettings', products: 'products', categories: 'categories',
  sales: 'sales', invoices: 'invoices', counter: 'invoiceCounter',
  reports: 'reports', theme: 'theme', dashboard: 'dashboardData'
};

const DEFAULT_SETTINGS = {
  name: 'Mathaka Gift Shop',
  address: 'Mathaka Gift Shop, Dondra, Matara',
  phone: '742899909',
  logo: '',
  currency: 'Rs',
  taxPercent: 0,
  footer: 'Thank You',
  receiptSize: '80',
  invoicePrefix: 'INV-',
  cashier: 'Admin',
  lowStockDefault: 5,
  showBarcode: true,
  autoPrint: false
};
const DEFAULT_CATEGORIES = ['Gift Items', 'Toys', 'Greeting Cards', 'Stationery', 'Flowers', 'Other'];

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = (v) => { const n = parseFloat(String(v ?? '').replace(/,/g, '')); return Number.isFinite(n) ? n : 0; };
const round2 = (n) => Math.round((n + Number.EPSILON) * 100) / 100;
const pad = (n) => String(n).padStart(2, '0');
const dateKey = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fmtNum = (n) => round2(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const money = (n) => `${DB.settings.currency} ${fmtNum(n)}`;
const fmtDate = (ts) => { const d = new Date(ts); return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`; };
const fmtTime = (ts) => new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const debounce = (fn, ms = 120) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const initial = (s) => (String(s || '?').trim()[0] || '?').toUpperCase();
const setText = (id, text) => { const el = document.getElementById(id); if (el && el.textContent !== text) el.textContent = text; };
const byName = (a, b) => String(a.name).localeCompare(String(b.name));

/** Trigger a file download from text content (works from file://) */
function download(filename, text, type = 'application/json') {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}
const readText = (file) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsText(file); });

/** Resize an image file to a compact data URL (keeps localStorage small) */
const imageToDataURL = (file, max = 320, mime = 'image/jpeg', quality = 0.82) => new Promise((res, rej) => {
  const r = new FileReader();
  r.onerror = rej;
  r.onload = () => {
    const img = new Image();
    img.onerror = rej;
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.width * k)); c.height = Math.max(1, Math.round(img.height * k));
      const ctx = c.getContext('2d');
      if (mime === 'image/jpeg') { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); }
      ctx.drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL(mime, quality));
    };
    img.src = r.result;
  };
  r.readAsDataURL(file);
});

/* Sale helpers */
const saleDate = (s) => s.date || dateKey(new Date(s.ts));
const saleProfit = (s) => round2(s.items.reduce((a, i) => a + (num(i.price) - num(i.cost)) * i.qty, 0) - num(s.discount));
const saleQty = (s) => s.items.reduce((a, i) => a + i.qty, 0);
const salesDesc = () => DB.sales.slice().sort((a, b) => String(b.ts).localeCompare(String(a.ts)));

/* Stock helpers */
const lowThreshold = (p) => (p.lowStock === null || p.lowStock === '' || p.lowStock === undefined || !Number.isFinite(+p.lowStock)) ? DB.settings.lowStockDefault : +p.lowStock;
const isOut = (p) => p.stock <= 0;
const isLow = (p) => p.stock <= lowThreshold(p);

/** Totals for a cart: discount is capped at subtotal, tax is added on the discounted amount */
function calcTotals(lines, discountValue, discountType, taxPercent) {
  const subtotal = round2(lines.reduce((a, l) => a + l.price * l.qty, 0));
  let discount = discountType === 'percent' ? subtotal * Math.min(Math.max(num(discountValue), 0), 100) / 100 : num(discountValue);
  discount = round2(Math.min(Math.max(discount, 0), subtotal));
  const tax = round2((subtotal - discount) * num(taxPercent) / 100);
  return { subtotal, discount, tax, total: round2(subtotal - discount + tax) };
}

const DB = {
  settings: { ...DEFAULT_SETTINGS }, products: [], categories: [], sales: [], invoices: [],
  counter: 1, reports: {}, theme: 'dark', dashboard: {},

  load() {
    const rd = (k, f) => { try { const v = localStorage.getItem(k); return v === null ? f : JSON.parse(v); } catch (e) { return f; } };
    const arr = (v) => (Array.isArray(v) ? v : []);
    this.settings = { ...DEFAULT_SETTINGS, ...(rd(LS.settings, {}) || {}) };
    this.products = arr(rd(LS.products, []));
    const cats = rd(LS.categories, null);
    this.categories = Array.isArray(cats) ? cats : DEFAULT_CATEGORIES.slice();
    this.sales = arr(rd(LS.sales, []));
    this.invoices = arr(rd(LS.invoices, []));
    this.counter = Math.max(1, parseInt(rd(LS.counter, 1), 10) || 1);
    this.reports = rd(LS.reports, {}) || {};
    this.dashboard = rd(LS.dashboard, {}) || {};
    this.theme = rd(LS.theme, 'dark') === 'light' ? 'light' : 'dark';
  },
  /** Persist one or more data sets, e.g. DB.save('products','sales') */
  save(...keys) {
    for (const k of keys) {
      try { localStorage.setItem(LS[k], JSON.stringify(this[k])); }
      catch (e) { Toast.show('Browser storage is full. Export a backup and remove old data or images.', { type: 'error', duration: 7000 }); }
    }
  },
  saveAll() { this.save(...Object.keys(LS)); },
  firstRun() { return localStorage.getItem(LS.settings) === null; },
  /** Recompute cached report/dashboard data after any sales change */
  rebuildDerived() {
    const byDate = {};
    for (const s of this.sales) {
      const d = byDate[saleDate(s)] || (byDate[saleDate(s)] = { revenue: 0, profit: 0, orders: 0, items: 0 });
      d.revenue = round2(d.revenue + s.total); d.profit = round2(d.profit + saleProfit(s)); d.orders++; d.items += saleQty(s);
    }
    this.reports = { generatedAt: new Date().toISOString(), byDate };
    const t = Reports.summarize(Reports.salesIn('today')), m = Reports.summarize(Reports.salesIn('month'));
    this.dashboard = {
      generatedAt: this.reports.generatedAt, todaySales: t.revenue, todayProfit: t.profit, todayOrders: t.count,
      monthRevenue: m.revenue, monthProfit: m.profit, products: this.products.length,
      lowStock: this.products.filter(isLow).length
    };
    this.save('reports', 'dashboard');
  },
  applyTheme() { document.documentElement.classList.toggle('dark', this.theme === 'dark'); },
  /** Next invoice number (never reuses an existing one) */
  peekInvoice() {
    let n = this.counter;
    const used = new Set(this.invoices.map((i) => i.invoice));
    const make = (x) => `${this.settings.invoicePrefix}${String(x).padStart(6, '0')}`;
    while (used.has(make(n))) n++;
    return { no: make(n), n };
  }
};

/* ======================= 3. REPORT AGGREGATION ======================= */
const Reports = {
  /** Inclusive date-key range for 'today' | 'week' (last 7 days) | 'month' (calendar month) */
  range(period) {
    const now = new Date(), today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    let from = new Date(today);
    if (period === 'week') from.setDate(from.getDate() - 6);
    if (period === 'month') from = new Date(now.getFullYear(), now.getMonth(), 1);
    return { from: dateKey(from), to: dateKey(today) };
  },
  salesIn(period) {
    const { from, to } = this.range(period);
    return DB.sales.filter((s) => { const k = saleDate(s); return k >= from && k <= to; });
  },
  summarize(sales) {
    const r = { revenue: 0, profit: 0, count: sales.length, avg: 0, items: 0, discount: 0, tax: 0 };
    for (const s of sales) { r.revenue += s.total; r.profit += saleProfit(s); r.items += saleQty(s); r.discount += num(s.discount); r.tax += num(s.tax); }
    r.revenue = round2(r.revenue); r.profit = round2(r.profit); r.discount = round2(r.discount); r.tax = round2(r.tax);
    r.avg = r.count ? round2(r.revenue / r.count) : 0;
    return r;
  },
  productStats(sales) {
    const map = new Map();
    for (const s of sales) for (const i of s.items) {
      const key = i.id || i.name;
      const e = map.get(key) || { id: i.id, name: i.name, qty: 0, revenue: 0 };
      e.qty += i.qty; e.revenue = round2(e.revenue + i.price * i.qty); map.set(key, e);
    }
    return map;
  },
  categoryStats(sales) {
    const map = new Map();
    for (const s of sales) for (const i of s.items) {
      const key = i.category || 'Uncategorized';
      const e = map.get(key) || { name: key, qty: 0, revenue: 0 };
      e.qty += i.qty; e.revenue = round2(e.revenue + i.price * i.qty); map.set(key, e);
    }
    return [...map.values()].sort((a, b) => b.revenue - a.revenue);
  },
  hourly(sales) {
    const out = Array.from({ length: 24 }, (_, h) => ({ label: `${pad(h)}:00`, short: h % 3 === 0 ? pad(h) : '', value: 0, count: 0 }));
    for (const s of sales) { const h = new Date(s.ts).getHours(); out[h].value = round2(out[h].value + s.total); out[h].count++; }
    return out;
  },
  daily(period) {
    const { from, to } = this.range(period), map = {};
    for (const s of this.salesIn(period)) map[saleDate(s)] = (map[saleDate(s)] || 0) + s.total;
    const out = [], d = new Date(from + 'T00:00:00'), end = new Date(to + 'T00:00:00');
    while (d <= end) {
      const k = dateKey(d);
      out.push({ key: k, label: `${pad(d.getDate())}/${pad(d.getMonth() + 1)}`, short: period === 'month' ? String(d.getDate()) : d.toLocaleDateString('en-US', { weekday: 'short' }), value: round2(map[k] || 0) });
      d.setDate(d.getDate() + 1);
    }
    return out;
  }
};

    const ic = { success: 'check', error: 'alert', warn: 'alert', info: 'check' }[type];
    const el = document.createElement('div');

    el.innerHTML = `${icon(ic, 'h-5 w-5 shrink-0')}<span class="flex-1 break-words"></span>`;

    }
    const dismiss = () => { el.classList.add('opacity-0', 'translate-y-2'); setTimeout(() => el.remove(), 300); };
    box.appendChild(el);
    requestAnimationFrame(() => requestAnimationFrame(() => el.classList.remove('opacity-0', 'translate-y-2')));
    setTimeout(dismiss, action ? Math.max(duration, 7000) : duration);
  },
  success(m, o) { this.show(m, { ...o, type: 'success' }); },
  error(m, o) { this.show(m, { ...o, type: 'error', duration: 5000 }); },
  warn(m, o) { this.show(m, { ...o, type: 'warn', duration: 4500 }); },

/* ======================= 8. CHARTS (inline SVG, no libraries) ======================= */
const Charts = {
  /** Vertical bar chart. data: [{label, short, value}] */
  bars(data, { height = 170, barSlot = 40 } = {}) {
    const W = Math.max(data.length * barSlot, 280), H = height, padB = 22, padT = 8;
    const max = Math.max(...data.map((d) => d.value), 1), bw = W / data.length;
    let out = `<svg viewBox="0 0 ${W} ${H}" class="h-auto w-full" role="img" aria-label="Bar chart">`;
    out += `<line x1="0" x2="${W}" y1="${H - padB}" y2="${H - padB}" class="stroke-neutral-300 dark:stroke-white/10"/>`;
    data.forEach((d, i) => {
      const h = d.value > 0 ? Math.max(3, (d.value / max) * (H - padB - padT)) : 0;
      const x = i * bw + bw * 0.16, w = bw * 0.68, y = H - padB - h;
      out += `<g><rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="3" class="fill-red-500 transition hover:fill-red-400"><title>${esc(d.label)}: ${esc(money(d.value))}</title></rect>`;
      out += `<text x="${(x + w / 2).toFixed(1)}" y="${H - 7}" text-anchor="middle" class="fill-neutral-500 text-[10px]">${esc(d.short ?? d.label)}</text></g>`;
    });
    return out + '</svg>';
  },
  /** Thin horizontal progress bar (0..100) */
  meter(pct, cls = 'fill-red-500') {
    const p = Math.max(0, Math.min(100, pct));
    return `<svg viewBox="0 0 100 4" preserveAspectRatio="none" class="h-1.5 w-full" aria-hidden="true"><rect width="100" height="4" class="fill-neutral-200 dark:fill-white/10"/><rect width="${p.toFixed(1)}" height="4" class="${cls}"/></svg>`;
  }
};

/* ======================= 10. CODE 128 BARCODE (SVG) ======================= */
const Code128 = {
  /** Bar/space widths for symbol values 0..105 (Start A/B/C = 103/104/105) */
  W: ['212222', '222122', '222221', '121223', '121322', '131222', '122213', '122312', '132212', '221213', '221312', '231212', '112232', '122132', '122231', '113222',
    '123122', '123221', '223211', '221132', '221231', '213212', '223112', '312131', '311222', '321122', '321221', '312212', '322112', '322211', '212123', '212321',
    '232121', '111323', '131123', '131321', '112313', '132113', '132311', '211313', '231113', '231311', '112133', '112331', '132131', '113123', '113321', '133121',
    '313121', '211331', '231131', '213113', '213311', '213131', '311123', '311321', '331121', '312113', '312311', '332111', '314111', '221411', '431111', '111224',
    '111422', '121124', '121421', '141122', '141221', '112214', '112412', '122114', '122411', '142112', '142211', '241211', '221114', '413111', '241112', '134111',
    '111242', '121142', '121241', '114212', '124112', '124211', '411212', '421112', '421211', '212141', '214121', '412121', '111143', '111341', '131141', '114113',
    '114311', '411113', '411311', '113141', '114131', '311141', '411131', '211412', '211214', '211232'],
  STOP: '2331112',
  /** Returns an SVG string encoding `text` (printable ASCII) as Code 128-B */
  svg(text, cls = 'h-10 w-full fill-black') {
    const vals = [104]; let sum = 104;
    [...String(text)].forEach((ch, i) => {
      let v = ch.charCodeAt(0) - 32; if (v < 0 || v > 94) v = 31;
      vals.push(v); sum += v * (i + 1);
    });
    vals.push(sum % 103);
    const widths = vals.map((v) => this.W[v]).join('') + this.STOP;
    const quiet = 10; let x = quiet, rects = '';
    [...widths].forEach((ch, i) => {
      const w = +ch;
      if (i % 2 === 0) rects += `<rect x="${x}" y="0" width="${w}" height="40"/>`;
      x += w;
    });
    return `<svg viewBox="0 0 ${x + quiet} 40" preserveAspectRatio="none" class="${cls}" role="img" aria-label="Barcode ${esc(text)}">${rects}</svg>`;
  }
};

/* ======================= 11. RECEIPT RENDERING & PRINTING ======================= */
/** Builds receipt HTML for 58mm / 80mm thermal paper or A4. Always black-on-white. */
function receiptHTML(sale, size = '80') {
  const s = DB.settings, A4 = size === 'A4', n = (v) => fmtNum(v);
  const wrap = { '58': 'w-[58mm] p-2 text-[10px] leading-snug', '80': 'w-[80mm] p-3 text-xs leading-snug', 'A4': 'mx-auto w-[190mm] p-10 text-sm leading-relaxed' }[size] || 'w-[80mm] p-3 text-xs leading-snug';
  const hr = '<div class="my-2 border-t border-dashed border-black"></div>';
  const row = (l, v, cls = '') => `<div class="flex justify-between gap-2 ${cls}"><span>${l}</span><span class="text-right">${v}</span></div>`;
  const dt = new Date(sale.ts);

  const head = `
    <div class="text-center">
      ${s.logo ? `<img src="${esc(s.logo)}" alt="" class="mx-auto mb-1 ${A4 ? 'max-h-24' : 'max-h-14'} max-w-[70%] object-contain">` : ''}
      <div class="${A4 ? 'text-2xl' : 'text-sm'} font-extrabold uppercase tracking-wide">${esc(s.name)}</div>
      ${s.address ? `<div>${esc(s.address)}</div>` : ''}
      ${s.phone ? `<div>Tel: ${esc(s.phone)}</div>` : ''}
    </div>${hr}
    ${row('Invoice', `<b>${esc(sale.invoice)}</b>`)}
    ${row('Date', fmtDate(sale.ts))}
    ${row('Time', dt.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }))}
    ${row('Cashier', esc(sale.cashier || s.cashier))}${hr}`;

  const items = A4
    ? `<table class="w-full border-collapse">
        <thead><tr class="border-b-2 border-black text-left"><th class="py-1">#</th><th class="py-1">Item</th><th class="py-1 text-right">Qty</th><th class="py-1 text-right">Price</th><th class="py-1 text-right">Amount</th></tr></thead>
        <tbody>${sale.items.map((i, k) => `<tr class="border-b border-neutral-300"><td class="py-1.5">${k + 1}</td><td class="py-1.5">${esc(i.name)}</td><td class="py-1.5 text-right">${i.qty}</td><td class="py-1.5 text-right">${n(i.price)}</td><td class="py-1.5 text-right">${n(i.price * i.qty)}</td></tr>`).join('')}</tbody></table>`
    : `${row('<b>Item</b>', '<b>Amount</b>')}
       ${sale.items.map((i) => `<div class="py-0.5"><div class="break-words font-semibold">${esc(i.name)}</div>${row(`${i.qty} x ${n(i.price)}`, n(i.price * i.qty))}</div>`).join('')}`;

  const totals = `${hr}
    <div class="${A4 ? 'ml-auto w-72' : ''}">
    ${row('Subtotal', n(sale.subtotal))}
    ${sale.discount > 0 ? row('Discount', `- ${n(sale.discount)}`) : ''}
    ${sale.tax > 0 ? row(`Tax (${num(sale.taxPercent)}%)`, n(sale.tax)) : ''}
    ${row('GRAND TOTAL', `${esc(s.currency)} ${n(sale.total)}`, `${A4 ? 'text-lg' : 'text-sm'} font-extrabold`)}
    ${row('Cash', n(sale.cash))}
    ${row('Balance', n(sale.balance), 'font-bold')}
    </div>${hr}`;

  const foot = `
    <div class="text-center">
      <div>Items: ${saleQty(sale)}</div>
      ${s.footer ? `<div class="mt-1 font-bold">${esc(s.footer)}</div>` : ''}
      ${s.showBarcode ? `<div class="mx-auto mt-2 ${A4 ? 'w-64' : 'w-4/5'}">${Code128.svg(sale.invoice)}<div class="mt-0.5 tracking-widest">${esc(sale.invoice)}</div></div>` : ''}
    </div>`;

  return `<div class="${wrap} bg-white font-mono text-black">${head}${items}${totals}${foot}</div>`;
}

  renderChips() {
    const cats = ['all', ...DB.categories.filter((c) => DB.products.some((p) => p.category === c))];
    const el = $('#posChips'); if (!el) return;
    el.innerHTML = cats.map((c) => `<button type="button" data-action="pos-chip" data-cat="${esc(c)}" class="shrink-0 rounded-full px-4 py-1.5 text-sm font-semibold transition ${this.cat === c ? 'bg-red-600 text-white shadow shadow-red-600/30' : 'bg-neutral-200/80 hover:bg-neutral-300 dark:bg-white/10 dark:hover:bg-white/20'}">${c === 'all' ? 'All' : esc(c)}</button>`).join('');
  },

  renderGrid() {
    const el = $('#posGrid'); if (!el) return;
    if (!DB.products.length) {
      el.innerHTML = `<div class="${C.empty} col-span-full">${icon('box', 'h-10 w-10')}<p class="text-base font-semibold">No products yet</p><p>Add your products to start billing.</p>
        <div class="mt-2 flex gap-2"><button type="button" data-action="nav" data-route="products" class="${C.primary}">Add products</button><button type="button" data-action="sample-products" class="${C.ghost}">Load sample products</button></div></div>`;
      return;
    }
    const list = this.filtered();
    if (!list.length) { el.innerHTML = `<div class="${C.empty} col-span-full">${icon('search', 'h-8 w-8')}No products match your search.</div>`; return; }
    el.innerHTML = list.slice(0, this.limit).map((p) => {
      const out = isOut(p), low = !out && isLow(p);
      return `<button type="button" data-action="pos-add" data-id="${esc(p.id)}" ${out ? 'disabled' : ''} class="group flex flex-col overflow-hidden rounded-2xl border border-neutral-200/80 bg-white/80 text-left shadow-sm transition active:scale-95 hover:border-red-500/60 hover:shadow-lg hover:shadow-red-600/10 disabled:pointer-events-none disabled:opacity-40 dark:border-white/10 dark:bg-neutral-900/60">
        <div class="relative aspect-[4/3] w-full overflow-hidden bg-neutral-200 dark:bg-neutral-800">
          ${p.image ? `<img src="${esc(p.image)}" alt="" loading="lazy" class="h-full w-full object-cover transition duration-300 group-hover:scale-105">` : `<div class="flex h-full w-full items-center justify-center bg-linear-to-br from-red-600 to-red-950 text-3xl font-extrabold text-white/90">${esc(initial(p.name))}</div>`}
          <span class="absolute right-2 top-2 rounded-full px-2 py-0.5 text-[10px] font-bold text-white ${out ? 'bg-red-600' : low ? 'bg-amber-500' : 'bg-black/60'}">${out ? 'OUT' : p.stock + ' left'}</span>
        </div>
        <div class="p-3"><p class="line-clamp-2 min-h-[2.5rem] text-sm font-semibold leading-tight">${esc(p.name)}</p><p class="mt-1 text-base font-extrabold text-red-600 dark:text-red-400">${money(p.price)}</p></div></button>`;
    }).join('') + (list.length > this.limit ? `<button type="button" data-action="pos-more" class="${C.ghost} col-span-full">Show more (${list.length - this.limit} more)</button>` : '');
  },

  renderCart() {
    const el = $('#cartLines'); if (!el) return;
    const lines = this.lines();
    el.innerHTML = lines.length ? lines.map((l) => `
      <div class="rounded-xl bg-neutral-100/80 p-2.5 dark:bg-white/5">
        <div class="flex items-start justify-between gap-2">
          <p class="min-w-0 flex-1 break-words text-sm font-semibold leading-tight">${esc(l.p.name)}</p>
          <button type="button" data-action="cart-remove" data-id="${esc(l.id)}" class="${C.iconBtn} h-7! w-7! text-red-500" aria-label="Remove">${icon('x', 'h-4 w-4')}</button>
        </div>
        <div class="mt-2 flex items-center justify-between gap-2">
          <div class="flex items-center gap-1">
            <button type="button" data-action="cart-dec" data-id="${esc(l.id)}" class="${C.iconBtn} h-8! w-8! bg-neutral-200 dark:bg-white/10" aria-label="Decrease">${icon('minus', 'h-4 w-4')}</button>
            <input type="number" min="1" step="1" inputmode="numeric" value="${l.qty}" data-change="cartQty" data-id="${esc(l.id)}" class="h-8 w-12 rounded-lg border border-neutral-300 bg-white text-center text-sm font-bold focus:border-red-500 focus:outline-none dark:border-white/10 dark:bg-neutral-900" aria-label="Quantity">
            <button type="button" data-action="cart-inc" data-id="${esc(l.id)}" class="${C.iconBtn} h-8! w-8! bg-neutral-200 dark:bg-white/10" aria-label="Increase">${icon('plus', 'h-4 w-4')}</button>
          </div>
          <span class="text-xs ${C.muted}">× ${fmtNum(l.price)}</span>
          <span class="text-sm font-extrabold">${fmtNum(l.price * l.qty)}</span>
        </div>
      </div>`).join('')
      : `<div class="${C.empty} h-full">${icon('cart', 'h-8 w-8')}Cart is empty.<br>Tap a product or scan a barcode.</div>`;
  },

  /** Update numbers only (keeps focus in inputs) */
  updateTotals() {
    const t = this.totals(), lines = this.lines(), count = lines.reduce((a, l) => a + l.qty, 0);
    setText('posInvoice', DB.peekInvoice().no);
    setText('posSubtotal', money(t.subtotal));
    setText('posDiscountAmt', t.discount > 0 ? `- ${money(t.discount)}` : money(0));
    setText('posTax', money(t.tax));
    setText('posTotal', money(t.total));
    const dt = $('#posDtype'); if (dt) dt.textContent = this.dtype === 'percent' ? '%' : DB.settings.currency;
    const cash = this.cash === '' ? null : num(this.cash), bal = cash === null ? 0 : round2(cash - t.total);
    const label = $('#posBalanceLabel'), val = $('#posBalance');
    if (label && val) {
      const short = cash !== null && bal < 0;
      label.textContent = short ? 'Amount due' : 'Balance';
      val.textContent = money(short ? -bal : bal);
      val.classList.toggle('text-red-600', short); val.classList.toggle('dark:text-red-400', short);
      val.classList.toggle('text-emerald-600', !short); val.classList.toggle('dark:text-emerald-400', !short);
    }
    const btn = $('#posComplete'); if (btn) btn.disabled = !lines.length;
    const bar = $('#posMobileBar');
    if (bar) { bar.classList.toggle('hidden', !count); bar.classList.toggle('flex', !!count); setText('posMobileCount', `${count} item${count === 1 ? '' : 's'}`); setText('posMobileTotal', money(t.total)); }
  },

  /* ---- cart operations ---- */
  add(id, qty = 1) {
    const p = this.product(id); if (!p) return;
    if (isOut(p)) return Toast.warn(`${p.name} is out of stock`);
    const line = this.cart.find((l) => l.id === id), have = line ? line.qty : 0;
    if (have + qty > p.stock) return Toast.warn(`Only ${p.stock} of "${p.name}" in stock`);
    if (line) line.qty += qty; else this.cart.unshift({ id, qty });
    this.renderCart(); this.updateTotals();
  },
  setQty(id, qty) {
    const p = this.product(id), line = this.cart.find((l) => l.id === id); if (!p || !line) return;
    qty = Math.floor(num(qty));
    if (qty <= 0) return this.remove(id);
    if (qty > p.stock) { Toast.warn(`Only ${p.stock} of "${p.name}" in stock`); qty = p.stock; }
    line.qty = qty; this.renderCart(); this.updateTotals();
  },
  remove(id) { this.cart = this.cart.filter((l) => l.id !== id); this.renderCart(); this.updateTotals(); },
  reset() {
    this.cart = []; this.q = ''; this.cat = 'all'; this.discount = ''; this.dtype = 'amount'; this.cash = ''; this.limit = 60;
    if (Router.current === 'pos') { this.render(); const s = $('#posSearch'); if (s) s.focus(); }
  },

  /** Barcode scanners "type" the code then press Enter */
  submitSearch() {
    const q = this.q.trim().toLowerCase(); if (!q) return;
    const exact = DB.products.find((p) => (p.barcode || '').toLowerCase() === q || (p.sku || '').toLowerCase() === q);
    const hit = exact || (this.filtered().length === 1 ? this.filtered()[0] : null);
    if (!hit) return Toast.warn(this.filtered().length ? 'Multiple matches — tap the product' : `No product found for "${this.q}"`);
    this.add(hit.id); this.q = ''; const s = $('#posSearch'); if (s) { s.value = ''; s.focus(); } this.renderGrid();
  },

  async cancel() {
    if (!this.cart.length) return Toast.info('Nothing to cancel');
    if (await Confirm.ask({ title: 'Cancel this sale?', message: 'All items in the cart will be removed.', confirmText: 'Cancel sale', danger: true })) { this.reset(); Toast.info('Sale cancelled'); }
  },
  async newSale() {
    if (this.cart.length && !(await Confirm.ask({ title: 'Start a new sale?', message: 'The current cart will be cleared.', confirmText: 'New sale' }))) return;
    this.reset();
  },

  /** Validate, save the sale, deduct stock, show the receipt */
  async complete() {
    const lines = this.lines();
    if (!lines.length) return Toast.warn('Cart is empty');
    for (const l of lines) if (l.qty > l.p.stock) return Toast.error(`Not enough stock for "${l.p.name}" (${l.p.stock} left)`);
    const t = this.totals(), cash = this.cash === '' ? t.total : num(this.cash);
    if (cash + 0.001 < t.total) { Toast.error('Cash received is less than the grand total'); const c = $('#posCash'); if (c) c.focus(); return; }

    const btn = $('#posComplete'); if (btn) { btn.disabled = true; btn.innerHTML = `${spinner} Saving…`; }
    await sleep(350);

    const inv = DB.peekInvoice(), now = new Date();
    const sale = {
      id: uid(), invoice: inv.no, ts: now.toISOString(), date: dateKey(now),
      items: lines.map((l) => ({ id: l.id, name: l.p.name, sku: l.p.sku, category: l.p.category, price: l.price, cost: l.cost, qty: l.qty })),
      subtotal: t.subtotal, discount: t.discount, discountType: this.dtype, discountInput: num(this.discount),
      taxPercent: num(DB.settings.taxPercent), tax: t.tax, total: t.total, cash: round2(cash), balance: round2(cash - t.total),
      cashier: DB.settings.cashier
    };
    const warn = [];
    for (const l of lines) { l.p.stock -= l.qty; if (isLow(l.p)) warn.push(l.p); }
    DB.sales.push(sale);
    DB.invoices.push({ invoice: sale.invoice, saleId: sale.id, ts: sale.ts, total: sale.total });
    DB.counter = inv.n + 1;
    DB.save('products', 'sales', 'invoices', 'counter'); DB.rebuildDerived();

    this.cart = []; this.q = ''; this.cat = 'all'; this.discount = ''; this.dtype = 'amount'; this.cash = '';
    this.render();
    Toast.success(`Sale ${sale.invoice} completed`);
    warn.forEach((p) => Toast.warn(p.stock <= 0 ? `${p.name} is now out of stock` : `Low stock: ${p.name} (${p.stock} left)`));
    Receipt.show(sale, { after: true });
  }
};

Actions['pos-add'] = (el) => POS.add(el.dataset.id);
Actions['cart-inc'] = (el) => POS.add(el.dataset.id);
Actions['cart-dec'] = (el) => { const l = POS.cart.find((x) => x.id === el.dataset.id); if (l) POS.setQty(l.id, l.qty - 1); };
Actions['cart-remove'] = (el) => POS.remove(el.dataset.id);
Actions['pos-chip'] = (el) => { POS.cat = el.dataset.cat; POS.limit = 60; POS.renderChips(); POS.renderGrid(); };
Actions['pos-more'] = () => { POS.limit += 60; POS.renderGrid(); };
Actions.dtype = () => { POS.dtype = POS.dtype === 'percent' ? 'amount' : 'percent'; POS.updateTotals(); };
Actions['quick-cash'] = (el) => {
  POS.cash = el.dataset.v === 'exact' ? String(POS.totals().total) : el.dataset.v;

};
Actions['pos-complete'] = () => POS.complete();
Actions['pos-cancel'] = () => POS.cancel();
Actions['pos-new'] = () => POS.newSale();
Actions['scroll-cart'] = () => { const c = $('#posCart'); if (c) c.scrollIntoView({ behavior: 'smooth', block: 'start' }); };
Inputs.posSearch = debounce((el) => { POS.q = el.value; POS.limit = 60; POS.renderGrid(); }, 90);
Inputs.posDiscount = (el) => { POS.discount = el.value; POS.updateTotals(); };

/** Normalise any product-like object (used for forms, imports and restores) */
function cleanProduct(raw, fallbackSku) {
  const img = typeof raw.image === 'string' && raw.image.startsWith('data:image/') ? raw.image : '';
  const ls = raw.lowStock === null || raw.lowStock === '' || raw.lowStock === undefined ? null : Math.max(0, Math.floor(num(raw.lowStock)));
  return {
    id: String(raw.id || uid()), name: String(raw.name || '').trim() || 'Unnamed product',
    sku: String(raw.sku || fallbackSku || '').trim(), barcode: String(raw.barcode || '').trim(),
    category: String(raw.category || 'Other').trim() || 'Other',
    price: Math.max(0, round2(num(raw.price))), cost: Math.max(0, round2(num(raw.cost))),
    stock: Math.max(0, Math.floor(num(raw.stock))), lowStock: ls, image: img,
    createdAt: raw.createdAt || new Date().toISOString(), updatedAt: new Date().toISOString()
  };
}

              </div>
            </div>
          </div>
        </div>
        <div class="sticky bottom-0 grid grid-cols-2 gap-3 border-t border-neutral-200 bg-white/95 p-4 backdrop-blur dark:border-white/10 dark:bg-neutral-900/95">
          <button type="button" data-action="modal-close" class="${C.ghost}">Cancel</button>
          <button type="submit" class="${C.primary}">${icon('check')} ${p ? 'Save changes' : 'Add product'}</button>
        </div>
      </form>`, { size: 'lg' });
    this.drawImagePreview();
    setTimeout(() => { const n = $('#pfName'); if (n) n.focus(); }, 80);
  },
  drawImagePreview() {
    const el = $('#pfImgPreview'); if (!el) return;
    el.innerHTML = this.tmpImage ? `<img src="${esc(this.tmpImage)}" alt="" class="h-20 w-20 rounded-2xl object-cover">`
      : `<div class="flex h-20 w-20 items-center justify-center rounded-2xl bg-neutral-200 text-neutral-400 dark:bg-white/10">${icon('image', 'h-7 w-7')}</div>`;
  },

  save(form) {
    const f = new FormData(form), id = f.get('id');
    const raw = Object.fromEntries(f.entries());
    const name = String(raw.name || '').trim();
    if (!name) return Toast.error('Product name is required');
    if (num(raw.price) < 0 || num(raw.cost) < 0) return Toast.error('Prices cannot be negative');
    const sku = String(raw.sku || '').trim() || (id ? '' : nextSku()), barcode = String(raw.barcode || '').trim();
    if (sku && DB.products.some((p) => p.id !== id && p.sku.toLowerCase() === sku.toLowerCase())) return Toast.error(`SKU "${sku}" is already used by another product`);
    if (barcode && DB.products.some((p) => p.id !== id && p.barcode && p.barcode === barcode)) return Toast.error(`Barcode "${barcode}" is already used by another product`);
    const existing = id ? DB.products.find((p) => p.id === id) : null;
    const data = cleanProduct({ ...raw, id: id || uid(), sku, image: this.tmpImage, createdAt: existing?.createdAt });
    if (existing) Object.assign(existing, data); else DB.products.unshift(data);
    ensureCategory(data.category);
    DB.save('products'); DB.rebuildDerived();
    Modal.close(); this.render(); Toast.success(existing ? 'Product updated' : 'Product added');
  },

  async remove(id) {
    const idx = DB.products.findIndex((p) => p.id === id); if (idx < 0) return;
    const p = DB.products[idx];
    if (!(await Confirm.ask({ title: 'Delete product?', message: `"${p.name}" will be removed from your catalogue. Past sales are not affected.`, confirmText: 'Delete', danger: true }))) return;
    DB.products.splice(idx, 1); POS.cart = POS.cart.filter((l) => l.id !== id);
    DB.save('products'); DB.rebuildDerived(); this.render();
    Toast.show(`Deleted "${p.name}"`, { type: 'info', action: { label: 'Undo', fn: () => { DB.products.splice(Math.min(idx, DB.products.length), 0, p); DB.save('products'); DB.rebuildDerived(); if (Router.current === 'products') this.render(); Toast.success('Product restored'); } } });
  },

  openCategories() {
    const rows = DB.categories.map((c) => {
      const n = DB.products.filter((p) => p.category === c).length;
      return `<div class="flex items-center justify-between gap-3 py-2.5"><div><p class="font-semibold">${esc(c)}</p><p class="text-xs ${C.muted}">${n} product${n === 1 ? '' : 's'}</p></div>
        <button type="button" data-action="cat-delete" data-name="${esc(c)}" class="${C.iconBtn} hover:text-red-500!" aria-label="Delete category">${icon('trash', 'h-4 w-4')}</button></div>`;
    }).join('');
    Modal.open(`${Modal.header('Categories', 'Group your products')}
      <div class="space-y-4 p-5">
        <form data-form="category" class="flex gap-2"><input name="name" required maxlength="40" placeholder="New category name" autocomplete="off" class="${C.input}"><button type="submit" class="${C.primary} shrink-0">${icon('plus', 'h-4 w-4')} Add</button></form>
        <div class="${C.divider}">${rows || `<p class="py-4 text-center text-sm ${C.muted}">No categories yet.</p>`}</div>
      </div>`, { size: 'sm' });
  }
};

  q: '', date: '', limit: 50,

  render() {
    $('#view').innerHTML = `
      ${pageHead('Sales History', 'Search, view, reprint or delete past bills')}
      <div class="${C.card} mb-4 grid gap-3 p-3! sm:grid-cols-[1fr_12rem_auto] sm:p-4!">

        <input type="date" id="saleDate" data-change="saleDate" value="${esc(this.date)}" class="${C.input}" aria-label="Filter by date">
        <button type="button" data-action="sales-clear" class="${C.ghost}">Clear</button>
      </div>
      <div id="saleSummary" class="mb-3 flex flex-wrap gap-2 text-sm"></div>
      <div class="${C.card} p-2! sm:p-3!"><div id="saleList"></div></div>`;
    this.renderList();
  },

  filtered() {
    const q = this.q.trim().toLowerCase();
    return salesDesc().filter((s) => (!this.date || saleDate(s) === this.date) &&
      (!q || s.invoice.toLowerCase().includes(q) || s.items.some((i) => i.name.toLowerCase().includes(q) || String(i.sku || '').toLowerCase().includes(q))));
  },

  renderList() {
    const el = $('#saleList'); if (!el) return;
    const list = this.filtered(), sum = Reports.summarize(list);
    const chip = (l, v) => `<span class="rounded-full bg-neutral-200/80 px-3 py-1 dark:bg-white/10"><span class="${C.muted}">${l}</span> <b>${v}</b></span>`;
    $('#saleSummary').innerHTML = chip('Bills', list.length) + chip('Revenue', money(sum.revenue)) + chip('Profit', money(sum.profit));
    if (!list.length) { el.innerHTML = `<div class="${C.empty}">${icon('receipt', 'h-8 w-8')}${DB.sales.length ? 'No bills match your filters.' : 'No sales recorded yet.'}</div>`; return; }
    el.innerHTML = `<div class="${C.divider}">${list.slice(0, this.limit).map((s) => `
      <div class="flex items-center gap-3 rounded-xl p-2.5 transition hover:bg-neutral-100/70 dark:hover:bg-white/5">
        <span class="hidden rounded-xl bg-red-600/10 p-2.5 text-red-600 sm:block dark:text-red-400">${icon('receipt')}</span>
        <div class="min-w-0 flex-1">
          <p class="font-semibold">${esc(s.invoice)}</p>
          <p class="truncate text-xs ${C.muted}">${fmtDate(s.ts)} · ${fmtTime(s.ts)} · ${saleQty(s)} items · ${esc(s.cashier || '')}</p>
          <p class="truncate text-xs ${C.muted}">${esc(s.items.map((i) => i.name).join(', '))}</p>
        </div>
        <div class="text-right"><p class="font-bold">${money(s.total)}</p><p class="hidden text-xs text-emerald-600 sm:block dark:text-emerald-400">Profit ${money(saleProfit(s))}</p></div>
        <div class="flex gap-0.5">
          <button type="button" data-action="sale-view" data-id="${esc(s.id)}" class="${C.iconBtn}" aria-label="View bill">${icon('eye', 'h-4 w-4')}</button>
          <button type="button" data-action="sale-print" data-id="${esc(s.id)}" class="${C.iconBtn}" aria-label="Print again">${icon('printer', 'h-4 w-4')}</button>
          <button type="button" data-action="sale-delete" data-id="${esc(s.id)}" class="${C.iconBtn} hover:text-red-500!" aria-label="Delete sale">${icon('trash', 'h-4 w-4')}</button>
        </div>
      </div>`).join('')}</div>
      ${list.length > this.limit ? `<button type="button" data-action="sales-more" class="${C.ghost} mt-2 w-full">Show more (${list.length - this.limit} more)</button>` : ''}`;
  },

  async remove(id) {
    const idx = DB.sales.findIndex((s) => s.id === id); if (idx < 0) return;
    const sale = DB.sales[idx];
    if (!(await Confirm.ask({ title: `Delete ${sale.invoice}?`, message: 'The bill is removed from reports and the sold quantities are returned to stock.', confirmText: 'Delete sale', danger: true }))) return;
    const adjust = (dir) => { for (const i of sale.items) { const p = DB.products.find((x) => x.id === i.id); if (p) p.stock = Math.max(0, p.stock + dir * i.qty); } };
    const invEntry = DB.invoices.find((x) => x.saleId === sale.id);
    adjust(+1); DB.sales.splice(idx, 1); DB.invoices = DB.invoices.filter((x) => x.saleId !== sale.id);
    DB.save('products', 'sales', 'invoices'); DB.rebuildDerived(); this.renderList();
    Toast.show(`Deleted ${sale.invoice}`, { type: 'info', action: { label: 'Undo', fn: () => {
      adjust(-1); DB.sales.push(sale); if (invEntry) DB.invoices.push(invEntry);
      DB.save('products', 'sales', 'invoices'); DB.rebuildDerived(); if (Router.current === 'sales') this.renderList(); Toast.success('Sale restored');
    } } });
  }
};

const ReportsView = {
  period: 'today',

  render() {
    const sales = Reports.salesIn(this.period), sum = Reports.summarize(sales);

    const sold = [...stats.values()];
    const most = sold.sort((a, b) => b.qty - a.qty).slice(0, 8);
    // Least sold: every catalogue product (including those with zero sales in the period)
    const least = DB.products.map((p) => ({ name: p.name, qty: (stats.get(p.id) || { qty: 0 }).qty })).sort((a, b) => a.qty - b.qty).slice(0, 8);
    const cats = Reports.categoryStats(sales), catMax = Math.max(...cats.map((c) => c.revenue), 1);
    const hourly = Reports.hourly(sales);
    const maxQ = Math.max(...most.map((x) => x.qty), 1);
    const periods = [['today', 'Today'], ['week', 'Last 7 days'], ['month', 'This month']];
    const { from, to } = Reports.range(this.period);

    $('#view').innerHTML = `
      ${pageHead('Reports', from === to ? fmtDate(from + 'T00:00:00') : `${fmtDate(from + 'T00:00:00')} – ${fmtDate(to + 'T00:00:00')}`,
        `<div class="grid grid-cols-3 gap-1 rounded-2xl bg-neutral-200/70 p-1 dark:bg-white/10">${periods.map(([v, l]) => `<button type="button" data-action="report-period" data-period="${v}" class="rounded-xl px-3 py-2 text-sm font-semibold transition ${this.period === v ? 'bg-red-600 text-white shadow' : 'text-neutral-600 hover:bg-white/60 dark:text-neutral-300 dark:hover:bg-white/10'}">${l}</button>`).join('')}</div>`)}

      <div class="grid grid-cols-2 gap-3 sm:gap-4 xl:grid-cols-4">
        ${statCard({ label: 'Revenue', value: money(sum.revenue), sub: `Tax included ${money(sum.tax)}`, ic: 'dollar', tone: 'red' })}
        ${statCard({ label: 'Profit', value: money(sum.profit), sub: `Discounts given ${money(sum.discount)}`, ic: 'trend', tone: 'green' })}
        ${statCard({ label: 'Transactions', value: sum.count, sub: `${sum.items} items sold`, ic: 'receipt', tone: 'slate' })}
        ${statCard({ label: 'Average sale', value: money(sum.avg), sub: 'Revenue per transaction', ic: 'layers', tone: 'amber' })}
      </div>

      <div class="mt-4 grid gap-4 lg:grid-cols-2">
        <section class="${C.card} lg:col-span-2">
          <div class="mb-3 flex items-center justify-between"><h3 class="${C.h2}">Hourly sales</h3><span class="text-xs ${C.muted}">Revenue by hour of day</span></div>
          ${sum.count ? Charts.bars(hourly, { height: 180, barSlot: 28 }) : `<div class="${C.empty}">No sales in this period.</div>`}
        </section>
        ${this.period !== 'today' ? `<section class="${C.card} lg:col-span-2">
          <div class="mb-3 flex items-center justify-between"><h3 class="${C.h2}">Daily revenue</h3></div>
          ${Charts.bars(Reports.daily(this.period), { height: 180, barSlot: this.period === 'month' ? 30 : 96 })}
        </section>` : ''}

        <section class="${C.card}">
          <h3 class="${C.h2} mb-3">Most sold products</h3>
          ${most.length ? `<div class="space-y-3">${most.map((p, i) => `<div><div class="mb-1 flex justify-between gap-2 text-sm"><span class="truncate font-semibold">${i + 1}. ${esc(p.name)}</span><span class="shrink-0 text-xs ${C.muted}">${p.qty} sold · ${money(p.revenue)}</span></div>${Charts.meter((p.qty / maxQ) * 100)}</div>`).join('')}</div>` : `<div class="${C.empty}">No sales in this period.</div>`}
        </section>
        <section class="${C.card}">
          <h3 class="${C.h2} mb-3">Least sold products</h3>
          ${least.length ? `<div class="${C.divider}">${least.map((p) => `<div class="flex items-center justify-between gap-2 py-2 text-sm"><span class="truncate font-semibold">${esc(p.name)}</span><span class="shrink-0 rounded-full bg-neutral-200/80 px-2.5 py-0.5 text-xs font-bold dark:bg-white/10">${p.qty} sold</span></div>`).join('')}</div>` : `<div class="${C.empty}">No products yet.</div>`}
        </section>
        <section class="${C.card} lg:col-span-2">
          <h3 class="${C.h2} mb-3">Category sales</h3>
          ${cats.length ? `<div class="grid gap-x-8 gap-y-3 sm:grid-cols-2">${cats.map((c) => `<div><div class="mb-1 flex justify-between gap-2 text-sm"><span class="truncate font-semibold">${esc(c.name)}</span><span class="shrink-0 text-xs ${C.muted}">${c.qty} items · ${money(c.revenue)}</span></div>${Charts.meter((c.revenue / catMax) * 100)}</div>`).join('')}</div>` : `<div class="${C.empty}">No sales in this period.</div>`}
        </section>
      </div>`;
  }
};

      ...DB.settings, name, address: String(f.address || '').trim(), phone: String(f.phone || '').trim(), cashier: String(f.cashier || '').trim() || 'Admin',
      logo: this.tmpLogo, currency: String(f.currency || '').trim() || 'Rs', taxPercent: Math.max(0, num(f.taxPercent)),
      invoicePrefix: String(f.invoicePrefix || '').trim(), lowStockDefault: Math.max(0, Math.floor(num(f.lowStockDefault))),
      receiptSize: ['58', '80', 'A4'].includes(f.receiptSize) ? f.receiptSize : '80', footer: String(f.footer || '').trim(),
      showBarcode: form.elements.showBarcode.checked, autoPrint: form.elements.autoPrint.checked
    };
    const c = Math.max(1, Math.floor(num(f.invoiceCounter))); if (c) DB.counter = c;
    DB.theme = f.theme === 'light' ? 'light' : 'dark'; DB.applyTheme();
    DB.save('settings', 'counter', 'theme'); DB.rebuildDerived();
    Shell.render(); Router.go(); Toast.success('Settings saved');
  }
};
Actions['logo-remove'] = () => { SettingsView.tmpLogo = ''; SettingsView.drawLogo(); };
Changes.logoFile = async (el) => {
  const file = el.files[0]; if (!file) return;
  try { SettingsView.tmpLogo = await imageToDataURL(file, 360, 'image/png'); SettingsView.drawLogo(); } catch (e) { Toast.error('Could not read that image'); }
  el.value = '';
};
Changes.theme = (el) => { DB.theme = el.value; DB.applyTheme(); DB.save('theme'); Shell.render(); };
Forms.settings = (form) => SettingsView.save(form);

/* ======================= 18. IMPORT / EXPORT / BACKUP ======================= */
const stamp = () => dateKey(new Date());
const DataView = {
  render() {
    let bytes = 0; try { for (const k of Object.values(LS)) bytes += (localStorage.getItem(k) || '').length * 2; } catch (e) { /* ignore */ }
    const card = (ic, title, text, buttons) => `<section class="${C.card} flex flex-col gap-4"><div class="flex items-start gap-3"><span class="rounded-xl p-2.5 ${TONES.red}">${icon(ic)}</span><div><h3 class="${C.h2}">${title}</h3><p class="text-sm ${C.muted}">${text}</p></div></div><div class="mt-auto flex flex-wrap gap-2">${buttons}</div></section>`;
    const file = (action, label) => `<label class="${C.ghost} cursor-pointer">${icon('upload', 'h-4 w-4')} ${label}<input type="file" accept="application/json,.json" data-change="${action}" class="hidden"></label>`;
    $('#view').innerHTML = `
      ${pageHead('Backup & Data', 'Export, import and restore your data. Everything is stored in this browser.')}
      <div class="mb-4 flex flex-wrap gap-2 text-sm">
        <span class="rounded-full bg-neutral-200/80 px-3 py-1 dark:bg-white/10"><span class="${C.muted}">Products</span> <b>${DB.products.length}</b></span>
        <span class="rounded-full bg-neutral-200/80 px-3 py-1 dark:bg-white/10"><span class="${C.muted}">Sales</span> <b>${DB.sales.length}</b></span>
        <span class="rounded-full bg-neutral-200/80 px-3 py-1 dark:bg-white/10"><span class="${C.muted}">Storage used</span> <b>${(bytes / 1024).toFixed(1)} KB</b></span>
      </div>
      <div class="grid gap-4 md:grid-cols-2">
        ${card('box', 'Products', 'Export your catalogue as JSON, or import products from a JSON file. Matching SKU / barcode items are updated, new ones are added.',
          `<button type="button" data-action="export-products" class="${C.primary}">${icon('download', 'h-4 w-4')} Export products</button>${file('importProducts', 'Import products')}`)}
        ${card('receipt', 'Sales', 'Download every recorded sale as a JSON file for accounting or analysis.',
          `<button type="button" data-action="export-sales" class="${C.primary}">${icon('download', 'h-4 w-4')} Export sales</button>`)}
        ${card('database', 'Complete system backup', 'Products, categories, sales, invoices, settings, logo and theme in a single file. Keep copies on a USB drive or another computer.',
          `<button type="button" data-action="backup" class="${C.primary}">${icon('download', 'h-4 w-4')} Download backup</button>${file('restoreBackup', 'Restore backup')}`)}
        ${card('alert', 'Reset everything', 'Permanently erases all products, sales and settings from this browser. Download a backup first.',
          `<button type="button" data-action="reset-all" class="${C.danger}">${icon('trash', 'h-4 w-4')} Reset everything</button>`)}
      </div>`;
  },

  collectBackup() {
    return { app: APP_ID, version: APP_VERSION, exportedAt: new Date().toISOString(), data: Object.fromEntries(Object.entries(LS).map(([k, key]) => [key, DB[k]])) };
  },
  async parseFile(el) {
    const file = el.files[0]; el.value = ''; if (!file) return null;
    try { return JSON.parse(await readText(file)); } catch (e) { Toast.error('That file is not valid JSON'); return null; }
  },
  async importProducts(el) {
    const obj = await this.parseFile(el); if (!obj) return;
    const list = Array.isArray(obj) ? obj : obj.products;
    if (!Array.isArray(list)) return Toast.error('No products found in that file');
    let added = 0, updated = 0;
    for (const raw of list) {
      if (!raw || typeof raw !== 'object' || !String(raw.name || '').trim()) continue;
      const hit = DB.products.find((p) => (raw.id && p.id === raw.id) || (raw.sku && p.sku && p.sku.toLowerCase() === String(raw.sku).toLowerCase()) || (raw.barcode && p.barcode && p.barcode === String(raw.barcode)));
      if (hit) { Object.assign(hit, cleanProduct({ ...raw, id: hit.id, createdAt: hit.createdAt }, hit.sku)); updated++; }
      else { DB.products.push(cleanProduct(raw, nextSku())); added++; }
    }
    (Array.isArray(obj.categories) ? obj.categories : []).forEach((c) => ensureCategory(String(c)));
    DB.products.forEach((p) => ensureCategory(p.category));
    DB.save('products', 'categories'); DB.rebuildDerived(); this.render();
    Toast.success(`Import finished: ${added} added, ${updated} updated`);
  },
  async restore(el) {
    const obj = await this.parseFile(el); if (!obj) return;
    const d = obj && obj.data;
    if (!d || typeof d !== 'object' || (obj.app && obj.app !== APP_ID)) return Toast.error('This is not a valid POS backup file');
    if (!Array.isArray(d[LS.products] || []) || !Array.isArray(d[LS.sales] || [])) return Toast.error('Backup file is damaged');
    if (!(await Confirm.ask({ title: 'Restore this backup?', message: `Backup from ${obj.exportedAt ? fmtDate(obj.exportedAt) : 'unknown date'}. All current data on this device will be replaced.`, confirmText: 'Restore', danger: true }))) return;
    for (const key of Object.values(LS)) if (d[key] !== undefined) localStorage.setItem(key, JSON.stringify(d[key]));
    DB.load(); DB.products = DB.products.map((p) => ({ ...cleanProduct(p, p.sku), createdAt: p.createdAt })); DB.saveAll(); DB.rebuildDerived(); DB.applyTheme();
    POS.cart = []; Shell.render(); Router.go(); Toast.success('Backup restored');
  },
  async reset() {
    if (!(await Confirm.ask({ title: 'Erase all data?', message: 'This deletes every product, sale and setting on this device. This cannot be undone.', confirmText: 'Erase everything', danger: true, requireText: 'RESET' }))) return;
    Object.values(LS).forEach((k) => localStorage.removeItem(k));
    location.hash = '#/dashboard'; location.reload();
  }
};
Actions['export-products'] = () => { download(`products-${stamp()}.json`, JSON.stringify({ app: APP_ID, type: 'products', exportedAt: new Date().toISOString(), categories: DB.categories, products: DB.products }, null, 2)); Toast.success('Products exported'); };
Actions['export-sales'] = () => { download(`sales-${stamp()}.json`, JSON.stringify({ app: APP_ID, type: 'sales', exportedAt: new Date().toISOString(), sales: DB.sales }, null, 2)); Toast.success('Sales exported'); };
Actions.backup = () => { download(`pos-backup-${stamp()}.json`, JSON.stringify(DataView.collectBackup(), null, 2)); Toast.success('Backup downloaded'); };
Actions['reset-all'] = () => DataView.reset();
Changes.importProducts = (el) => DataView.importProducts(el);
Changes.restoreBackup = (el) => DataView.restore(el);


/* ======================= 19. APP SHELL (sidebar, header, mobile nav) ======================= */
const ROUTES = [
  { id: 'dashboard', label: 'Dashboard', icon: 'home' },
  { id: 'pos', label: 'POS Billing', icon: 'cart' },
  { id: 'products', label: 'Products', icon: 'box' },
  { id: 'sales', label: 'Sales History', icon: 'receipt' },
  { id: 'reports', label: 'Reports', icon: 'chart' },
  { id: 'settings', label: 'Settings', icon: 'sliders' },
  { id: 'data', label: 'Backup', icon: 'database' }
];
const Views = { dashboard: Dashboard, pos: POS, products: ProductsView, sales: SalesView, reports: ReportsView, settings: SettingsView, data: DataView };

const Router = {
  current: 'dashboard',
  init() { window.addEventListener('hashchange', () => this.go()); this.go(); },
  go() {
    const id = location.hash.replace(/^#\/?/, '') || 'dashboard';
    this.current = Views[id] ? id : 'dashboard';
    Shell.update();
    Views[this.current].render();
    window.scrollTo(0, 0);
  },
  to(id) { if (location.hash === '#/' + id) this.go(); else location.hash = '#/' + id; }
};

const Shell = {
  render() {
    const s = DB.settings, dark = DB.theme === 'dark';
    const keep = $('#view'); // preserve the current page (and any typed input) when only the chrome changes
    $('#app').innerHTML = `
      <div class="pointer-events-none fixed inset-0 z-0 bg-[image:radial-gradient(60rem_40rem_at_top_right,rgba(220,38,38,0.16),transparent),radial-gradient(40rem_30rem_at_bottom_left,rgba(220,38,38,0.08),transparent)]"></div>
      <aside class="fixed inset-y-0 left-0 z-20 hidden w-64 flex-col gap-2 border-r border-neutral-200/80 bg-white/70 p-4 backdrop-blur-xl lg:flex dark:border-white/10 dark:bg-black/40">
        <div class="flex items-center gap-3 px-2 py-3">
          ${s.logo ? `<img src="${esc(s.logo)}" alt="" class="h-11 w-11 rounded-xl bg-white object-contain p-0.5">` : `<span class="flex h-11 w-11 items-center justify-center rounded-xl bg-linear-to-br from-red-600 to-red-900 text-white shadow-lg shadow-red-600/30">${icon('gift', 'h-6 w-6')}</span>`}
          <div class="min-w-0"><p class="truncate text-sm font-extrabold leading-tight">${esc(s.name)}</p><p class="text-[11px] ${C.muted}">Point of Sale</p></div>
        </div>
        <nav id="navDesktop" class="mt-2 flex flex-1 flex-col gap-1"></nav>
        <button type="button" data-action="toggle-theme" class="${C.ghost} w-full justify-start">${icon(dark ? 'sun' : 'moon', 'h-4 w-4')} ${dark ? 'Light mode' : 'Dark mode'}</button>
        <p class="px-2 pt-2 text-[11px] leading-snug ${C.muted}">Works offline · data is saved on this device</p>
      </aside>
      <div class="relative z-10 lg:pl-64">
        <header class="sticky top-0 z-20 flex items-center justify-between gap-3 border-b border-neutral-200/80 bg-white/70 px-4 py-3 backdrop-blur-xl lg:px-6 dark:border-white/10 dark:bg-black/40">
          <div class="flex min-w-0 items-center gap-3">
            <span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl bg-red-600 text-white lg:hidden">${icon('gift', 'h-5 w-5')}</span>
            <div class="min-w-0"><h1 id="pageTitle" class="truncate text-base font-extrabold leading-tight"></h1><p id="clock" class="text-[11px] ${C.muted}"></p></div>
          </div>
          <div class="flex items-center gap-1.5">
            <button type="button" data-action="show-shortcuts" class="${C.iconBtn} hidden sm:inline-flex" aria-label="Keyboard shortcuts" title="Keyboard shortcuts (?)">${icon('keyboard')}</button>
            <button type="button" data-action="toggle-theme" class="${C.iconBtn} lg:hidden" aria-label="Toggle theme">${icon(dark ? 'sun' : 'moon')}</button>
            <button type="button" data-action="nav" data-route="pos" class="${C.primary} py-2!">${icon('plus', 'h-4 w-4')} <span class="hidden sm:inline">New Sale</span></button>
          </div>
        </header>
        <main id="view" class="p-4 pb-40 lg:p-6 lg:pb-10"></main>
      </div>
      <nav id="navMobile" class="fixed inset-x-0 bottom-0 z-30 flex gap-1 overflow-x-auto border-t border-neutral-200/80 bg-white/90 p-2 backdrop-blur-xl lg:hidden dark:border-white/10 dark:bg-neutral-950/90"></nav>`;
    if (keep) $('#view').replaceWith(keep);
    this.update(); this.tick();
  },
  update() {
    const cur = Router.current, r = ROUTES.find((x) => x.id === cur);
    const nd = $('#navDesktop'), nm = $('#navMobile');
    if (nd) nd.innerHTML = ROUTES.map((x, i) => `
      <button type="button" data-action="nav" data-route="${x.id}" class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-semibold transition ${x.id === cur ? 'bg-red-600 text-white shadow-lg shadow-red-600/25' : 'text-neutral-600 hover:bg-neutral-200/70 dark:text-neutral-300 dark:hover:bg-white/10'}">
        ${icon(x.icon, 'h-5 w-5')}<span class="flex-1 text-left">${x.label}</span><kbd class="rounded bg-black/10 px-1.5 text-[10px] font-medium opacity-60 dark:bg-white/10">Alt+${i + 1}</kbd></button>`).join('');
    if (nm) nm.innerHTML = ROUTES.map((x) => `
      <button type="button" data-action="nav" data-route="${x.id}" class="flex min-w-[4.5rem] shrink-0 flex-col items-center gap-0.5 rounded-xl px-2 py-1.5 text-[11px] font-semibold transition ${x.id === cur ? 'bg-red-600 text-white' : 'text-neutral-500 dark:text-neutral-400'}">${icon(x.icon, 'h-5 w-5')}${x.label.split(' ')[0]}</button>`).join('');
    const t = $('#pageTitle'); if (t && r) t.textContent = r.label;
  },
  tick() { const el = $('#clock'); if (el) el.textContent = new Date().toLocaleString('en-GB', { weekday: 'short', day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }); }
};

Actions['toggle-theme'] = () => { DB.theme = DB.theme === 'dark' ? 'light' : 'dark'; DB.applyTheme(); DB.save('theme'); Shell.render(); if (Router.current === 'settings') Router.go(); };
Actions['show-shortcuts'] = () => {
  const rows = [['F2', 'Focus product search / scan barcode'], ['F3', 'Focus cash received'], ['F4', 'Focus discount'], ['F8', 'Cancel current sale'], ['F9  or  Ctrl+Enter', 'Complete sale'],
    ['Enter (in search)', 'Add product matching barcode / SKU'], ['Alt+1 … Alt+7', 'Switch between pages'], ['Esc', 'Close dialog'], ['?', 'Show this help']];
  Modal.open(`${Modal.header('Keyboard shortcuts', 'Work faster at the counter')}<div class="p-5"><div class="${C.divider}">${rows.map(([k, d]) => `<div class="flex items-center justify-between gap-3 py-2.5 text-sm"><span>${d}</span><kbd class="shrink-0 rounded-lg bg-neutral-200 px-2.5 py-1 text-xs font-bold dark:bg-white/10">${k}</kbd></div>`).join('')}</div></div>`, { size: 'sm' });
};

/* ======================= 20. GLOBAL EVENTS & KEYBOARD SHORTCUTS ======================= */
function bindEvents() {
  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-action]');
    if (el && Actions[el.dataset.action]) { if (el.tagName === 'A') e.preventDefault(); Actions[el.dataset.action](el, e); }
  });
  document.addEventListener('input', (e) => { const el = e.target.closest('[data-input]'); if (el && Inputs[el.dataset.input]) Inputs[el.dataset.input](el, e); });
  document.addEventListener('change', (e) => { const el = e.target.closest('[data-change]'); if (el && Changes[el.dataset.change]) Changes[el.dataset.change](el, e); });
  document.addEventListener('submit', (e) => { const f = e.target.closest('[data-form]'); if (f && Forms[f.dataset.form]) { e.preventDefault(); Forms[f.dataset.form](f); } });

  document.addEventListener('keydown', (e) => {
    const tag = e.target.tagName, typing = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
    if (e.key === 'Escape') { if (Confirm.isOpen()) Confirm.done(false); else if (Modal.isOpen()) Modal.close(); return; }
    if (Confirm.isOpen()) { if (e.key === 'Enter' && !$('#dialogOk').disabled) { e.preventDefault(); Confirm.done(true); } return; }
    if (e.altKey && /^Digit[1-7]$/.test(e.code)) { e.preventDefault(); Router.to(ROUTES[+e.code.slice(5) - 1].id); return; }
    if (e.key === '?' && !typing && !Modal.isOpen()) { e.preventDefault(); Actions['show-shortcuts'](); return; }
    if (Modal.isOpen()) return;

    const focusPOS = (id) => { const go = () => { const el = $(id); if (el) { el.focus(); if (el.select) el.select(); } }; if (Router.current !== 'pos') { Router.to('pos'); setTimeout(go, 60); } else go(); };
    if (e.key === 'F2') { e.preventDefault(); focusPOS('#posSearch'); }
    else if (e.key === 'F3') { e.preventDefault(); focusPOS('#posCash'); }
    else if (e.key === 'F4') { e.preventDefault(); focusPOS('#posDiscount'); }
    else if (e.key === 'F8' && Router.current === 'pos') { e.preventDefault(); POS.cancel(); }
    else if ((e.key === 'F9' || (e.key === 'Enter' && e.ctrlKey)) && Router.current === 'pos') { e.preventDefault(); POS.complete(); }
    else if (e.key === 'Enter' && e.target.id === 'posSearch') { e.preventDefault(); POS.q = e.target.value; POS.submitSearch(); }
  });
}

/* ======================= 21. BOOT ======================= */
const App = {
  init() {
    DB.load();
    if (DB.firstRun()) { DB.saveAll(); DB.rebuildDerived(); }
    DB.applyTheme();
    Shell.render(); bindEvents(); Router.init();
    setInterval(() => Shell.tick(), 30000);
    setTimeout(() => {
      const b = $('#boot'); if (!b) return;
      b.classList.add('opacity-0', 'pointer-events-none'); setTimeout(() => b.remove(), 520);
    }, 450);
  }
};
document.addEventListener('DOMContentLoaded', () => App.init());

</script>
